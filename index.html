<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Name That Private Jet</title>
<style>
  :root {
    --bg: #0a1628;
    --bg-elevated: #122038;
    --surface: #1a2d4a;
    --border: rgba(255,255,255,0.08);
    --text: #f0f4fa;
    --text-muted: #8a9bb5;
    --accent: #3d9eff;
    --accent-dim: rgba(61,158,255,0.15);
    --success: #3ecf8e;
    --success-dim: rgba(62,207,142,0.18);
    --danger: #ff6b6b;
    --danger-dim: rgba(255,107,107,0.18);
    --placard-bg: rgba(8,16,32,0.92);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --radius: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: calc(12px + var(--safe-top)) 16px 12px;
    background: rgba(10,22,40,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header h1 {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .score {
    font-size: 0.9rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .score .called { color: var(--success); }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px 16px calc(16px + var(--safe-bottom));
    gap: 12px;
  }

  /* Photo stage */
  .photo-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    user-select: none;
    -webkit-user-select: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .photo-stage.loading { cursor: wait; }

  .photo-stage img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.25s ease;
  }

  .photo-stage img.hidden { opacity: 0; }

  .photo-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .loading-spinner {
    display: none;
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .photo-stage.loading .loading-spinner { display: block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 20px;
    text-align: center;
  }

  .photo-stage.error .error-box { display: flex; }
  .photo-stage.error img { display: none; }

  .error-box p {
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .retry-btn {
    pointer-events: auto;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  .retry-btn:active { opacity: 0.85; }

  /* Placard — off-screen until .revealed */
  .placard {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--placard-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 14px 16px 16px;
    transform: translateY(100%);
    transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .photo-stage.revealed .placard {
    transform: translateY(0);
  }

  .placard .mfr {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 2px;
  }

  .placard .name {
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text);
  }

  .placard .sub {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Hint link */
  .hint-row {
    min-height: 1.4em;
  }

  .hint-link {
    color: var(--accent);
    font-size: 0.9rem;
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    border-bottom: 1px solid rgba(61,158,255,0.3);
    padding: 0;
    font-family: inherit;
  }

  .hint-link:hover { border-bottom-color: var(--accent); }
  .hint-link:disabled { opacity: 0.4; cursor: default; border-bottom-color: transparent; }

  .hint-text {
    display: none;
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.4;
    font-style: italic;
  }

  .hint-text.visible { display: block; }

  /* Multiple-choice grid — visible once image is ready, before answer */
  .choices {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .choices.visible { display: grid; }

  .choice-btn {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 10px;
    font-size: 0.82rem;
    font-weight: 600;
    font-family: inherit;
    line-height: 1.25;
    text-align: center;
    color: var(--text);
    background: var(--surface);
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, border-color 0.15s, opacity 0.15s;
    -webkit-user-select: none;
    user-select: none;
    min-height: 52px;
  }

  .choice-btn:active:not(:disabled) { transform: scale(0.97); }

  .choice-btn:disabled {
    cursor: default;
  }

  .choice-btn.correct {
    background: var(--success-dim);
    border-color: var(--success);
    color: var(--success);
  }

  .choice-btn.wrong {
    background: var(--danger-dim);
    border-color: var(--danger);
    color: var(--danger);
  }

  .choice-btn.dimmed {
    opacity: 0.45;
  }

  /* Fact + Next (post-answer) */
  .after-reveal {
    display: none;
    flex-direction: column;
    gap: 14px;
    animation: fadeIn 0.3s ease;
  }

  .after-reveal.visible { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fact {
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg-elevated);
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .btn {
    appearance: none;
    border: none;
    border-radius: 10px;
    padding: 14px 12px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
    -webkit-user-select: none;
    user-select: none;
  }

  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .btn-next {
    background: var(--accent);
    color: #fff;
    width: 100%;
  }

  /* Attribution — hidden until after answer (filename often leaks type) */
  .attrib {
    display: none;
    font-size: 0.7rem;
    color: var(--text-muted);
    line-height: 1.35;
    opacity: 0.75;
  }

  .attrib.visible { display: block; }

  .attrib a {
    color: var(--text-muted);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .attrib a:hover { color: var(--accent); }
</style>
</head>

    /\bTC-[A-Z]{3}\b/i,
    /\bRA-\d{5}\b/i,
    /\bZS-[A-Z]{3}\b/i
  ];

  // --- State ---
  let deck = [];
  let deckIndex = 0;
  let round = 1;
  let called = 0;
  let answered = 0;
  let revealed = false;
  let advancing = false;
  let usedFileTitles = new Set();
  let current = null; // { type, image, registration }
  let nextReady = null; // preloaded round data
  let preloadPromise = null;

  // --- DOM ---
  const stage = document.getElementById("stage");
  const photo = document.getElementById("photo");
  const scoreEl = document.getElementById("score");
  const hintBtn = document.getElementById("hintBtn");
  const hintText = document.getElementById("hintText");
  const choicesEl = document.getElementById("choices");
  const afterReveal = document.getElementById("afterReveal");
  const factEl = document.getElementById("fact");
  const nextBtn = document.getElementById("nextBtn");
  const attrib = document.getElementById("attrib");
  const mfrEl = document.getElementById("mfr");
  const nameEl = document.getElementById("name");
  const subEl = document.getElementById("sub");
  const retryBtn = document.getElementById("retryBtn");
  const errorMsg = document.getElementById("errorMsg");

  function typeKey(t) {
    return t.manufacturer + "|" + t.displayName;
  }

  function labelFor(t) {
    return t.manufacturer + " " + t.displayName;
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /**
   * Build 6 similar choices: correct + 5 distractors.
   * Prefer same sizeClass, then same manufacturer, then rest of catalog.
   * Never duplicate the correct type; shuffle so correct isn't always same slot.
   */
  function buildChoices(correct) {
    const correctKey = typeKey(correct);
    const pool = CATALOG.filter(t => typeKey(t) !== correctKey);

    const sameSize = shuffle(pool.filter(t => t.sizeClass === correct.sizeClass));
    const sameMfr = shuffle(pool.filter(t =>
      t.manufacturer === correct.manufacturer && t.sizeClass !== correct.sizeClass
    ));
    const others = shuffle(pool.filter(t =>
      t.sizeClass !== correct.sizeClass && t.manufacturer !== correct.manufacturer
    ));

    const picked = [];
    const pickedKeys = new Set();

    function takeFrom(list, n) {
      for (const t of list) {
        if (picked.length >= n) break;
        const k = typeKey(t);
        if (pickedKeys.has(k)) continue;
        pickedKeys.add(k);
        picked.push(t);
      }
    }

    takeFrom(sameSize, 5);
    takeFrom(sameMfr, 5);
    takeFrom(others, 5);

    // If somehow short (tiny catalog), pad from remaining pool
    if (picked.length < 5) {
      takeFrom(shuffle(pool), 5);
    }

    const choices = shuffle([correct].concat(picked.slice(0, 5)));
    return choices;
  }

  function renderChoices(correct) {
    const opts = buildChoices(correct);
    choicesEl.innerHTML = "";
    opts.forEach(function (t) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice-btn";
      btn.textContent = labelFor(t);
      btn.dataset.key = typeKey(t);
      btn.addEventListener("click", function () {
        onChoose(t);
      });
      choicesEl.appendChild(btn);
    });
    choicesEl.classList.add("visible");
  }

  function refillDeck(avoidType) {
    let types = shuffle(CATALOG);
    if (avoidType && types.length > 1 && types[0] === avoidType) {
      const swap = 1 + Math.floor(Math.random() * (types.length - 1));
      [types[0], types[swap]] = [types[swap], types[0]];
    }
    deck = types;
    deckIndex = 0;
  }

  function nextType() {
    if (deckIndex >= deck.length) {
      refillDeck(current && current.type);
    }
    const t = deck[deckIndex++];
    return t;
  }

  function parseRegistration(title) {
    if (!title) return null;
    let name = title.replace(/^File:/i, "");
    name = name.replace(/\.[^.]+$/, "");
    name = name.replace(/_/g, " ");
    for (const re of REG_PATTERNS) {
      const m = name.match(re);
      if (m) return m[0].toUpperCase();
    }
    return null;
  }

  function buildApiUrl(query) {
    const params = new URLSearchParams({
      action: "query",
      format: "json",
      origin: "*",
      generator: "search",
      gsrsearch: query,
      gsrnamespace: "6",
      gsrlimit: "20",
      prop: "imageinfo",
      iiprop: "url|size|mime|extmetadata",
      iiurlwidth: "1200"
    });
    return COMMONS_API + "?" + params.toString();
  }

  function isUsablePage(page) {
    const info = page.imageinfo && page.imageinfo[0];
    if (!info) return false;
    const mime = (info.mime || "").toLowerCase();
    if (mime !== "image/jpeg" && mime !== "image/png") return false;
    const title = (page.title || "").toLowerCase();
    if (/logo|diagram|drawing|schematic|cutaway|silhouette|icon|svg/i.test(title)) return false;
    return true;
  }

  function scoreImage(page) {
    const info = page.imageinfo[0];
    let s = 0;
    if (info.mime === "image/jpeg") s += 2;
    if (info.width && info.height) {
      if (info.width >= info.height) s += 5;
      if (info.width >= 800) s += 2;
      if (info.width >= 1200) s += 1;
    }
    const title = (page.title || "").toLowerCase();
    if (/airport|ramp|taxi|flying|inflight|in-flight|airborne|approach/i.test(title)) s += 1;
    if (usedFileTitles.has(page.title)) s -= 20;
    return s;
  }

  async function fetchImagesForQuery(query) {
    const url = buildApiUrl(query);
    const res = await fetch(url);
    if (!res.ok) throw new Error("Commons HTTP " + res.status);
    const data = await res.json();
    if (!data.query || !data.query.pages) return [];
    return Object.values(data.query.pages).filter(isUsablePage);
  }

  async function findImageForType(type) {
    let candidates = [];
    for (const q of type.searchQueries) {
      try {
        const pages = await fetchImagesForQuery(q);
        candidates = candidates.concat(pages);
        if (candidates.length >= 3) break;
      } catch (e) {
        // try next query
      }
    }
    const seen = new Set();
    candidates = candidates.filter(p => {
      if (seen.has(p.title)) return false;
      seen.add(p.title);
      return true;
    });

    let fresh = candidates.filter(p => !usedFileTitles.has(p.title));
    if (!fresh.length) fresh = candidates;
    if (!fresh.length) return null;

    fresh.sort((a, b) => scoreImage(b) - scoreImage(a));
    const topScore = scoreImage(fresh[0]);
    const top = fresh.filter(p => scoreImage(p) >= topScore - 2);
    const pick = top[Math.floor(Math.random() * top.length)];
    const info = pick.imageinfo[0];
    const meta = info.extmetadata || {};
    const artistRaw = (meta.Artist && meta.Artist.value) || "";
    const artist = stripHtml(artistRaw) || "Unknown artist";
    const fileUrl = info.thumburl || info.url;
    const descUrl = info.descriptionurl || ("https://commons.wikimedia.org/wiki/" + encodeURIComponent(pick.title));

    return {
      title: pick.title,
      url: fileUrl,
      artist: artist,
      descriptionUrl: descUrl,
      registration: parseRegistration(pick.title)
    };
  }

  function stripHtml(html) {
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    return (tmp.textContent || tmp.innerText || "").trim().replace(/\s+/g, " ");
  }

  function preloadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Image load failed"));
      img.src = url;
    });
  }

  async function prepareRound(preferType) {
    const tried = new Set();
    let attempts = 0;
    const maxAttempts = Math.min(8, CATALOG.length);

    while (attempts < maxAttempts) {
      attempts++;
      const type = preferType && attempts === 1 ? preferType : nextType();
      if (tried.has(type.displayName)) continue;
      tried.add(type.displayName);

      try {
        const image = await findImageForType(type);
        if (!image) continue;
        await preloadImage(image.url);
        return { type, image, registration: image.registration };
      } catch (e) {
        // try another type
      }
    }
    throw new Error("Couldn't find a usable Wikimedia image. Check your connection and try again.");
  }

  function updateScore() {
    scoreEl.innerHTML =
      "Round " + round + " · <span class=\"called\">" + called + "</span>/" + answered + " called";
  }

  function clearAnswerUi() {
    afterReveal.classList.remove("visible");
    factEl.textContent = "";
    attrib.innerHTML = "";
    attrib.classList.remove("visible");
    choicesEl.innerHTML = "";
    choicesEl.classList.remove("visible");
    mfrEl.textContent = "";
    nameEl.textContent = "";
    subEl.textContent = "";
    photo.alt = "Business aircraft";
  }

  function showLoading() {
    stage.classList.add("loading");
    stage.classList.remove("error", "revealed");
    photo.classList.add("hidden");
    hintBtn.style.display = "";
    hintText.classList.remove("visible");
    hintText.textContent = "";
    clearAnswerUi();
    revealed = false;
  }

  function showError(msg) {
    stage.classList.remove("loading", "revealed");
    stage.classList.add("error");
    photo.classList.add("hidden");
    errorMsg.textContent = msg || "Couldn't load image.";
    clearAnswerUi();
  }

  function applyRound(data) {
    current = data;
    usedFileTitles.add(data.image.title);

    showLoading();
    // Keep alt generic until after answer — manufacturer/type would leak
    photo.alt = "Business aircraft";
    photo.src = data.image.url;
    photo.classList.remove("hidden");
    stage.classList.remove("loading", "error");

    // Placard text filled now but CSS keeps it translated off-screen until .revealed
    mfrEl.textContent = data.type.manufacturer;
    nameEl.textContent = data.type.displayName;
    const parts = [data.type.sizeClass];
    if (data.registration) parts.push(data.registration);
    subEl.textContent = parts.join(" · ");

    // Fact and attribution prepared but not shown until answer
    factEl.textContent = data.type.fact;
    hintText.textContent = data.type.hint;

    const titleShort = data.image.title.replace(/^File:/i, "");
    attrib.innerHTML =
      '<a href="' + escapeAttr(data.image.descriptionUrl) + '" target="_blank" rel="noopener noreferrer">' +
      escapeHtml(titleShort) + "</a>" +
      " · " + escapeHtml(data.image.artist) +
      " · via Wikimedia Commons";
    attrib.classList.remove("visible");

    renderChoices(data.type);

    hintBtn.disabled = false;
    nextBtn.disabled = false;
    advancing = false;
    updateScore();

    startPreloadNext();
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/'/g, "&#39;");
  }

  function startPreloadNext() {
    preloadPromise = prepareRound(null)
      .then(data => {
        nextReady = data;
        return data;
      })
      .catch(() => {
        nextReady = null;
      });
  }

  async function loadInitial() {
    showLoading();
    refillDeck(null);
    try {
      const data = await prepareRound(null);
      applyRound(data);
    } catch (e) {
      showError(e.message || "Couldn't load image.");
    }
  }

  function onChoose(selected) {
    if (revealed || !current || stage.classList.contains("loading") || stage.classList.contains("error")) {
      return;
    }
    revealed = true;

    const correctKey = typeKey(current.type);
    const selectedKey = typeKey(selected);
    const isCorrect = selectedKey === correctKey;

    const buttons = choicesEl.querySelectorAll(".choice-btn");
    buttons.forEach(function (btn) {
      btn.disabled = true;
      const key = btn.dataset.key;
      if (key === correctKey) {
        btn.classList.add("correct");
      } else if (key === selectedKey && !isCorrect) {
        btn.classList.add("wrong");
      } else {
        btn.classList.add("dimmed");
      }
    });

    // Reveal placard on photo
    stage.classList.add("revealed");

    // Show fact + attribution; update alt now that answer is known
    photo.alt = labelFor(current.type);
    afterReveal.classList.add("visible");
    attrib.classList.add("visible");

    // Hide hint button after answer; leave hint text if already shown
    hintBtn.style.display = "none";

    if (isCorrect) called++;
    answered++;
    updateScore();
  }

  function showHint() {
    if (revealed) return;
    hintBtn.style.display = "none";
    hintText.classList.add("visible");
  }

  async function advance() {
    if (advancing || !revealed) return;
    advancing = true;
    nextBtn.disabled = true;

    round++;
    updateScore();

    showLoading();

    try {
      let data = nextReady;
      nextReady = null;
      if (!data && preloadPromise) {
        try { data = await preloadPromise; } catch (_) {}
      }
      if (!data) {
        data = await prepareRound(null);
      }
      applyRound(data);
    } catch (e) {
      showError(e.message || "Couldn't load next image.");
      advancing = false;
    }
  }

  // Photo tap does NOT reveal — ignore stage clicks except retry
  hintBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    showHint();
  });

  nextBtn.addEventListener("click", function () { advance(); });

  retryBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    loadInitial();
  });

  // Boot
  loadInitial();
})();
</script>
</body>
</html>
