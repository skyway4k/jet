<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Name That Private Jet</title>
<style>
  :root {
    --bg: #0a1628;
    --bg-elevated: #122038;
    --surface: #1a2d4a;
    --border: rgba(255,255,255,0.08);
    --text: #f0f4fa;
    --text-muted: #8a9bb5;
    --accent: #3d9eff;
    --accent-dim: rgba(61,158,255,0.15);
    --success: #3ecf8e;
    --success-dim: rgba(62,207,142,0.18);
    --danger: #ff6b6b;
    --danger-dim: rgba(255,107,107,0.18);
    --placard-bg: rgba(8,16,32,0.92);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --radius: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: calc(12px + var(--safe-top)) 16px 12px;
    background: rgba(10,22,40,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header h1 {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .score {
    font-size: 0.9rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .score .called { color: var(--success); }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px 16px calc(16px + var(--safe-bottom));
    gap: 12px;
  }

  /* Photo stage */
  .photo-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    user-select: none;
    -webkit-user-select: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .photo-stage.loading { cursor: wait; }

  .photo-stage img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.15s ease;
  }

  .photo-stage img.hidden { opacity: 0; }

  .photo-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .loading-spinner {
    display: none;
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .photo-stage.loading .loading-spinner { display: block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 20px;
    text-align: center;
  }

  .photo-stage.error .error-box { display: flex; }
  .photo-stage.error img { display: none; }

  .error-box p {
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .retry-btn {
    pointer-events: auto;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  .retry-btn:active { opacity: 0.85; }

  /* Placard — off-screen until .revealed */
  .placard {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--placard-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 14px 16px 16px;
    transform: translateY(100%);
    transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .photo-stage.revealed .placard {
    transform: translateY(0);
  }

  .placard .mfr {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 2px;
  }

  .placard .name {
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text);
  }

  .placard .sub {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Hint link */
  .hint-row {
    min-height: 1.4em;
  }

  .hint-link {
    color: var(--accent);
    font-size: 0.9rem;
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    border-bottom: 1px solid rgba(61,158,255,0.3);
    padding: 0;
    font-family: inherit;
  }

  .hint-link:hover { border-bottom-color: var(--accent); }
  .hint-link:disabled { opacity: 0.4; cursor: default; border-bottom-color: transparent; }

  .hint-text {
    display: none;
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.4;
    font-style: italic;
  }

  .hint-text.visible { display: block; }

  /* Multiple-choice grid — visible once image is ready, before answer */
  .choices {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .choices.visible { display: grid; }

  .choice-btn {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 10px;
    font-size: 0.82rem;
    font-weight: 600;
    font-family: inherit;
    line-height: 1.25;
    text-align: center;
    color: var(--text);
    background: var(--surface);
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, border-color 0.15s, opacity 0.15s;
    -webkit-user-select: none;
    user-select: none;
    min-height: 52px;
  }

  .choice-btn:active:not(:disabled) { transform: scale(0.97); }

  .choice-btn:disabled {
    cursor: default;
  }

  .choice-btn.correct {
    background: var(--success-dim);
    border-color: var(--success);
    color: var(--success);
  }

  .choice-btn.wrong {
    background: var(--danger-dim);
    border-color: var(--danger);
    color: var(--danger);
  }

  .choice-btn.dimmed {
    opacity: 0.45;
  }

  /* Fact + tap hint (post-answer) */
  .after-reveal {
    display: none;
    flex-direction: column;
    gap: 10px;
    animation: fadeIn 0.15s ease;
  }

  .after-reveal.visible { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fact {
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg-elevated);
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .tap-hint {
    display: none;
    text-align: center;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0.85;
    padding: 4px 0 2px;
    pointer-events: none;
  }

  .tap-hint.visible { display: block; }

  .main.can-advance {
    cursor: pointer;
  }

  .btn {
    appearance: none;
    border: none;
    border-radius: 10px;
    padding: 14px 12px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
    -webkit-user-select: none;
    user-select: none;
  }

  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  /* Attribution — hidden until after answer (filename often leaks type) */
  .attrib {
    display: none;
    font-size: 0.7rem;
    color: var(--text-muted);
    line-height: 1.35;
    opacity: 0.75;
  }

  .attrib.visible { display: block; }

  .attrib a {
    color: var(--text-muted);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .attrib a:hover { color: var(--accent); }

  .score-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .streak-badge {
    font-size: 0.75rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }

  .streak-badge .n { color: var(--text); }

  /* Start screen */
  .screen-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
    background: rgba(6, 12, 24, 0.96);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .screen-overlay.hidden { display: none; }

  .start-card, .lb-card {
    width: 100%;
    max-width: 400px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 22px 24px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.45);
  }

  .start-eyebrow {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
    text-align: center;
  }

  .start-title {
    font-size: 1.55rem;
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .start-sub {
    font-size: 0.9rem;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 22px;
    line-height: 1.4;
  }

  .name-label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .name-input {
    width: 100%;
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px;
    font-size: 1.05rem;
    font-family: inherit;
    font-weight: 600;
    color: var(--text);
    background: var(--surface);
    outline: none;
    margin-bottom: 14px;
  }

  .name-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .name-input::placeholder { color: var(--text-muted); font-weight: 500; }

  .name-error {
    display: none;
    font-size: 0.8rem;
    color: var(--danger);
    margin: -6px 0 12px;
  }

  .name-error.visible { display: block; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    width: 100%;
  }

  /* Leaderboard / end run */
  .lb-card { max-height: min(90dvh, 640px); display: flex; flex-direction: column; }

  .lb-result {
    text-align: center;
    margin-bottom: 18px;
  }

  .lb-result .miss-label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--danger);
    margin-bottom: 6px;
  }

  .lb-result .streak-final {
    font-size: 2.4rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    color: var(--text);
  }

  .lb-result .streak-final span {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-muted);
    display: block;
    margin-top: 4px;
  }

  .lb-rank {
    margin-top: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--accent);
  }

  .lb-heading {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .lb-list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
  }

  .lb-list li {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }

  .lb-list li:last-child { border-bottom: none; }

  .lb-list li.you {
    background: var(--accent-dim);
    border-color: transparent;
  }

  .lb-list .rank {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  .lb-list .pname {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lb-list .pstreak {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--success);
  }

  .lb-empty {
    padding: 20px 12px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .game-shell.hidden-game {
    visibility: hidden;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="screen-overlay" id="startScreen" role="dialog" aria-labelledby="startTitle">
    <div class="start-card">
      <p class="start-eyebrow">Trivia</p>
      <h2 class="start-title" id="startTitle">Name That Private Jet</h2>
      <p class="start-sub">How many can you call in a row? Enter your name and start the streak.</p>
      <label class="name-label" for="playerName">Your name</label>
      <input type="text" class="name-input" id="playerName" maxlength="24" autocomplete="nickname" placeholder="Pilot name" enterkeyhint="go">
      <p class="name-error" id="nameError">Enter a name to play.</p>
      <button type="button" class="btn btn-primary" id="startBtn">Start</button>
    </div>
  </div>

  <div class="screen-overlay hidden" id="lbScreen" role="dialog" aria-labelledby="lbTitle">
    <div class="lb-card">
      <div class="lb-result">
        <p class="miss-label" id="lbTitle">Streak ended</p>
        <p class="streak-final" id="lbStreakFinal">0<span>in a row</span></p>
        <p class="lb-rank" id="lbRank"></p>
      </div>
      <p class="lb-heading">Longest streaks</p>
      <ul class="lb-list" id="lbList"></ul>
      <button type="button" class="btn btn-primary" id="playAgainBtn">Play again</button>
    </div>
  </div>

  <div class="game-shell hidden-game" id="gameShell">
  <header class="header">
    <h1>Name That Jet</h1>
    <div class="score-wrap">
      <div class="score" id="score">Round 1 · <span class="called">0</span>/0 called</div>
      <div class="streak-badge" id="streakBadge">Streak <span class="n" id="streakVal">0</span></div>
    </div>
  </header>

  <main class="main">
    <div class="photo-stage loading" id="stage" aria-label="Aircraft photo">
      <img id="photo" class="hidden" alt="Business aircraft">
      <div class="photo-overlay">
        <div class="loading-spinner" aria-hidden="true"></div>
        <div class="error-box">
          <p id="errorMsg">Couldn't load image.</p>
          <button type="button" class="retry-btn" id="retryBtn">Retry</button>
        </div>
      </div>
      <div class="placard" id="placard" aria-live="polite">
        <div class="mfr" id="mfr"></div>
        <div class="name" id="name"></div>
        <div class="sub" id="sub"></div>
      </div>
    </div>

    <div class="hint-row">
      <button type="button" class="hint-link" id="hintBtn">Give me a hint</button>
      <p class="hint-text" id="hintText"></p>
    </div>

    <div class="choices" id="choices" role="group" aria-label="Guess the aircraft"></div>

    <div class="after-reveal" id="afterReveal">
      <p class="fact" id="fact"></p>
      <p class="tap-hint" id="tapHint">Tap anywhere to continue</p>
    </div>

    <p class="attrib" id="attrib"></p>
  </main>
  </div>

<script>

  // --- Registration patterns from Commons filenames ---
  const REG_PATTERNS = [
    /\bN\d{1,5}[A-Z]{0,2}\b/i,
    /\bG-[A-Z]{4}\b/i,
    /\bC-[A-Z][A-Z0-9]{3}\b/i,
    /\bD-[A-Z]{4}\b/i,
    /\bF-[A-Z]{4}\b/i,
    /\bHB-[A-Z0-9]+\b/i,
    /\bP[PRT]-[A-Z0-9]+\b/i,
    /\bVH-[A-Z]{3}\b/i,
    /\bZK-[A-Z]{3}\b/i,
    /\bJA\d{4}[A-Z]?\b/i,
    /\bB-\d{3,5}[A-Z]?\b/i,
    /\bM-[A-Z]{4}\b/i,
    /\bT7-[A-Z0-9]+\b/i,
    /\b9H-[A-Z]{3}\b/i,
    /\bOE-[A-Z0-9]+\b/i,
    /\bOY-[A-Z]{3}\b/i,
    /\bSE-[A-Z]{3}\b/i,
    /\bPH-[A-Z]{3}\b/i,
    /\bI-[A-Z]{4}\b/i,
    /\bEC-[A-Z]{3}\b/i,
    /\bCS-[A-Z]{3}\b/i,
    /\bLX-[A-Z]{3}\b/i,
    /\bVP-[A-Z]{3}\b/i,
    /\bVQ-[A-Z]{3}\b/i,
    /\bA6-[A-Z]{3}\b/i,
    /\bA7-[A-Z]{3}\b/i,
    /\bHZ-[A-Z0-9]+\b/i,
    /\bTC-[A-Z]{3}\b/i,
    /\bRA-\d{5}\b/i,
    /\bZS-[A-Z]{3}\b/i
  ];

  // --- Persistence ---
  const LS_NAME = "nameThatJetPlayerName";
  const LS_BOARD = "nameThatJetLeaderboard";
  const LB_CAP = 20;

  // --- Image / search caches (memory + sessionStorage) ---
  const SS_SEARCH = "nameThatJetSearchCache_v1";
  const searchCache = new Map(); // query -> simplified page candidates
  const typePoolCache = new Map(); // typeKey -> simplified candidates[]
  const inFlightQueries = new Map(); // query -> Promise

  function restoreSearchCache() {
    try {
      const raw = sessionStorage.getItem(SS_SEARCH);
      if (!raw) return;
      const obj = JSON.parse(raw);
      if (!obj || typeof obj !== "object") return;
      Object.keys(obj).forEach(function (k) {
        if (Array.isArray(obj[k])) searchCache.set(k, obj[k]);
      });
    } catch (e) { /* ignore */ }
  }

  function persistSearchCache() {
    try {
      const obj = {};
      let n = 0;
      searchCache.forEach(function (v, k) {
        if (n >= 80) return; // cap sessionStorage size
        obj[k] = v;
        n++;
      });
      sessionStorage.setItem(SS_SEARCH, JSON.stringify(obj));
    } catch (e) { /* quota / private mode */ }
  }

  restoreSearchCache();

  // --- State ---
  let deck = [];
  let deckIndex = 0;
  let round = 1;
  let called = 0;
  let answered = 0;
  let streak = 0;
  let playerName = "";
  let revealed = false;
  let advancing = false;
  let runEnded = false;
  let canAdvance = false;
  let loadGen = 0;
  let usedFileTitles = new Set();
  let current = null; // { type, image, registration }
  let nextReady = null; // preloaded round data
  let preloadPromise = null;
  let lastLbEntryId = null;

  // --- DOM ---
  const stage = document.getElementById("stage");
  const photo = document.getElementById("photo");
  const scoreEl = document.getElementById("score");
  const streakVal = document.getElementById("streakVal");
  const hintBtn = document.getElementById("hintBtn");
  const hintText = document.getElementById("hintText");

  const factEl = document.getElementById("fact");
  const tapHint = document.getElementById("tapHint");
  const mainEl = document.querySelector(".main");
  const attrib = document.getElementById("attrib");
  const mfrEl = document.getElementById("mfr");
  const nameEl = document.getElementById("name");
  const subEl = document.getElementById("sub");
  const retryBtn = document.getElementById("retryBtn");
  const errorMsg = document.getElementById("errorMsg");
  const startScreen = document.getElementById("startScreen");
  const lbScreen = document.getElementById("lbScreen");
  const gameShell = document.getElementById("gameShell");
  const playerNameInput = document.getElementById("playerName");
  const nameError = document.getElementById("nameError");
  const startBtn = document.getElementById("startBtn");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const lbStreakFinal = document.getElementById("lbStreakFinal");
  const lbRank = document.getElementById("lbRank");
  const lbList = document.getElementById("lbList");

  function typeKey(t) {
    return t.manufacturer + "|" + t.displayName;
  }

  function labelFor(t) {
    return t.manufacturer + " " + t.displayName;
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /**
   * Build 6 similar choices: correct + 5 distractors.
   * Prefer same sizeClass, then same manufacturer, then rest of catalog.
   * Never duplicate the correct type; shuffle so correct isn't always same slot.
   */
  function buildChoices(correct) {
    const correctKey = typeKey(correct);
    const pool = CATALOG.filter(t => typeKey(t) !== correctKey);

    const sameSize = shuffle(pool.filter(t => t.sizeClass === correct.sizeClass));
    const sameMfr = shuffle(pool.filter(t =>
      t.manufacturer === correct.manufacturer && t.sizeClass !== correct.sizeClass
    ));
    const others = shuffle(pool.filter(t =>
      t.sizeClass !== correct.sizeClass && t.manufacturer !== correct.manufacturer
    ));

    const picked = [];
    const pickedKeys = new Set();

    function takeFrom(list, n) {
      for (const t of list) {
        if (picked.length >= n) break;
        const k = typeKey(t);
        if (pickedKeys.has(k)) continue;
        pickedKeys.add(k);
        picked.push(t);
      }
    }

    takeFrom(sameSize, 5);
    takeFrom(sameMfr, 5);
    takeFrom(others, 5);

    // If somehow short (tiny catalog), pad from remaining pool
    if (picked.length < 5) {
      takeFrom(shuffle(pool), 5);
    }

    const choices = shuffle([correct].concat(picked.slice(0, 5)));
    return choices;
  }

  function renderChoices(correct) {
    const opts = buildChoices(correct);
    choicesEl.innerHTML = "";
    opts.forEach(function (t) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice-btn";
      btn.textContent = labelFor(t);
      btn.dataset.key = typeKey(t);
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        onChoose(t);
      });
      choicesEl.appendChild(btn);
    });
    choicesEl.classList.add("visible");
  }

  function refillDeck(avoidType) {
    let types = shuffle(CATALOG);
    if (avoidType && types.length > 1 && types[0] === avoidType) {
      const swap = 1 + Math.floor(Math.random() * (types.length - 1));
      [types[0], types[swap]] = [types[swap], types[0]];
    }
    deck = types;
    deckIndex = 0;
  }

  function nextType() {
    if (deckIndex >= deck.length) {
      refillDeck(current && current.type);
    }
    const t = deck[deckIndex++];
    return t;
  }

  function parseRegistration(title) {
    if (!title) return null;
    let name = title.replace(/^File:/i, "");
    name = name.replace(/\.[^.]+$/, "");
    name = name.replace(/_/g, " ");
    for (const re of REG_PATTERNS) {
      const m = name.match(re);
      if (m) return m[0].toUpperCase();
    }
    return null;
  }

  function buildApiUrl(query) {
    const params = new URLSearchParams({
      action: "query",
      format: "json",
      origin: "*",
      generator: "search",
      gsrsearch: query,
      gsrnamespace: "6",
      gsrlimit: "20",
      prop: "imageinfo",
      iiprop: "url|size|mime|extmetadata",
      iiurlwidth: "1000"
    });
    return COMMONS_API + "?" + params.toString();
  }

  function simplifyPage(page) {
    const info = page.imageinfo && page.imageinfo[0];
    if (!info) return null;
    const mime = (info.mime || "").toLowerCase();
    if (mime !== "image/jpeg" && mime !== "image/png") return null;
    const title = page.title || "";
    if (/logo|diagram|drawing|schematic|cutaway|silhouette|icon|svg/i.test(title)) return null;
    const meta = info.extmetadata || {};
    const artistRaw = (meta.Artist && meta.Artist.value) || "";
    return {
      title: title,
      mime: mime,
      width: info.width || 0,
      height: info.height || 0,
      url: info.thumburl || info.url,
      descriptionUrl: info.descriptionurl || ("https://commons.wikimedia.org/wiki/" + encodeURIComponent(title)),
      artistRaw: artistRaw
    };
  }

  function scoreCandidate(c) {
    let s = 0;
    if (c.mime === "image/jpeg") s += 2;
    if (c.width && c.height) {
      if (c.width >= c.height) s += 5;
      if (c.width >= 800) s += 2;
      if (c.width >= 1000) s += 1;
    }
    const title = (c.title || "").toLowerCase();
    if (/airport|ramp|taxi|flying|inflight|in-flight|airborne|approach/i.test(title)) s += 1;
    if (usedFileTitles.has(c.title)) s -= 20;
    return s;
  }

  async function fetchImagesForQuery(query) {
    if (searchCache.has(query)) return searchCache.get(query);
    if (inFlightQueries.has(query)) return inFlightQueries.get(query);

    const p = (async function () {
      const url = buildApiUrl(query);
      const res = await fetch(url);
      if (!res.ok) throw new Error("Commons HTTP " + res.status);
      const data = await res.json();
      let list = [];
      if (data.query && data.query.pages) {
        list = Object.values(data.query.pages)
          .map(simplifyPage)
          .filter(Boolean);
      }
      searchCache.set(query, list);
      persistSearchCache();
      return list;
    })();

    inFlightQueries.set(query, p);
    try {
      return await p;
    } finally {
      inFlightQueries.delete(query);
    }
  }

  async function loadCandidatesForType(type) {
    const key = typeKey(type);
    if (typePoolCache.has(key) && typePoolCache.get(key).length) {
      return typePoolCache.get(key);
    }

    const results = await Promise.all(
      type.searchQueries.map(function (q) {
        return fetchImagesForQuery(q).catch(function () { return []; });
      })
    );

    const seen = new Set();
    const candidates = [];
    results.forEach(function (pages) {
      pages.forEach(function (c) {
        if (seen.has(c.title)) return;
        seen.add(c.title);
        candidates.push(c);
      });
    });

    typePoolCache.set(key, candidates);
    return candidates;
  }

  async function findImageForType(type) {
    // Optional local/user images (future): type.images or type.localImage
    if (type.localImage) {
      return {
        title: type.displayName + " (local)",
        url: type.localImage,
        artist: "Local photo",
        descriptionUrl: "#",
        registration: null
      };
    }
    if (Array.isArray(type.images) && type.images.length) {
      const unused = type.images.filter(function (u) { return !usedFileTitles.has(u); });
      const pickUrl = (unused.length ? unused : type.images)[Math.floor(Math.random() * (unused.length || type.images.length))];
      return {
        title: type.displayName + " (local)",
        url: pickUrl,
        artist: "Local photo",
        descriptionUrl: "#",
        registration: null
      };
    }

    const candidates = await loadCandidatesForType(type);
    if (!candidates.length) return null;

    let fresh = candidates.filter(function (c) { return !usedFileTitles.has(c.title); });
    if (!fresh.length) fresh = candidates.slice();

    fresh.sort(function (a, b) { return scoreCandidate(b) - scoreCandidate(a); });
    const topScore = scoreCandidate(fresh[0]);
    const top = fresh.filter(function (c) { return scoreCandidate(c) >= topScore - 2; });
    const pick = top[Math.floor(Math.random() * top.length)];
    const artist = stripHtml(pick.artistRaw) || "Unknown artist";

    return {
      title: pick.title,
      url: pick.url,
      artist: artist,
      descriptionUrl: pick.descriptionUrl,
      registration: parseRegistration(pick.title)
    };
  }

  function stripHtml(html) {
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    return (tmp.textContent || tmp.innerText || "").trim().replace(/\s+/g, " ");
  }

  function preloadImage(url) {
    return new Promise(function (resolve, reject) {
      const img = new Image();
      img.decoding = "async";
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error("Image load failed")); };
      img.src = url;
    });
  }

  /** Warm Commons search cache for upcoming deck types (non-blocking). */
  function warmUpcomingTypes(count) {
    const n = count || 3;
    let idx = deckIndex;
    let warmed = 0;
    while (warmed < n && idx < deck.length) {
      const t = deck[idx++];
      loadCandidatesForType(t).catch(function () {});
      warmed++;
    }
  }

  async function prepareRound(preferType) {
    const tried = new Set();
    let attempts = 0;
    const maxAttempts = Math.min(10, CATALOG.length);

    while (attempts < maxAttempts) {
      attempts++;
      const type = preferType && attempts === 1 ? preferType : nextType();
      if (tried.has(type.displayName)) continue;
      tried.add(type.displayName);

      try {
        const image = await findImageForType(type);
        if (!image) continue;
        await preloadImage(image.url);
        return { type: type, image: image, registration: image.registration };
      } catch (e) {
        // try another type
      }
    }
    throw new Error("Couldn't find a usable Wikimedia image. Check your connection and try again.");
  }

  function updateScore() {
    scoreEl.innerHTML =
      "Round " + round + " · <span class=\"called\">" + called + "</span>/" + answered + " called";
    if (streakVal) streakVal.textContent = String(streak);
  }

  function loadLeaderboard() {
    try {
      const raw = localStorage.getItem(LS_BOARD);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function saveLeaderboard(entries) {
    localStorage.setItem(LS_BOARD, JSON.stringify(entries.slice(0, LB_CAP)));
  }

  function sortBoard(entries) {
    return entries.slice().sort(function (a, b) {
      if (b.streak !== a.streak) return b.streak - a.streak;
      const da = a.date || "";
      const db = b.date || "";
      return db < da ? -1 : db > da ? 1 : 0;
    });
  }

  function appendStreakEntry(name, streakLen) {
    if (!streakLen || streakLen < 1) return null;
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      name: name,
      streak: streakLen,
      date: new Date().toISOString()
    };
    const board = sortBoard(loadLeaderboard().concat([entry]));
    saveLeaderboard(board);
    return entry;
  }

  /** Rank among board entries for a given streak (1-based), with tie note. */
  function describeRank(board, streakLen) {
    if (!board.length) return { label: "", rank: 0, total: 0 };
    let rank = 1;
    for (let i = 0; i < board.length; i++) {
      if (board[i].streak > streakLen) rank = i + 2;
      else break;
    }
    // Recount properly: rank = 1 + number of entries with strictly higher streak
    rank = 1;
    for (const e of board) {
      if (e.streak > streakLen) rank++;
    }
    const total = board.length;
    const same = board.filter(function (e) { return e.streak === streakLen; }).length;
    let label;
    if (same > 1) {
      label = "Tied for #" + rank + " of " + total;
    } else {
      label = "#" + rank + " of " + total;
    }
    return { label: label, rank: rank, total: total };
  }

  function renderLeaderboard(highlightId) {
    const board = sortBoard(loadLeaderboard());
    lbList.innerHTML = "";
    if (!board.length) {
      const empty = document.createElement("li");
      empty.className = "lb-empty";
      empty.style.display = "block";
      empty.textContent = "No streaks yet — get one right to start the board.";
      lbList.appendChild(empty);
      return board;
    }
    board.forEach(function (e, i) {
      const li = document.createElement("li");
      if (highlightId && e.id === highlightId) li.className = "you";
      const rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = "#" + (i + 1);
      const pn = document.createElement("span");
      pn.className = "pname";
      pn.textContent = e.name;
      const ps = document.createElement("span");
      ps.className = "pstreak";
      ps.textContent = e.streak;
      li.appendChild(rank);
      li.appendChild(pn);
      li.appendChild(ps);
      lbList.appendChild(li);
    });
    return board;
  }

  function endRun(finalStreak) {
    if (runEnded) return;
    runEnded = true;
    lastLbEntryId = null;
    let board;
    if (finalStreak > 0) {
      const entry = appendStreakEntry(playerName, finalStreak);
      lastLbEntryId = entry && entry.id;
      board = sortBoard(loadLeaderboard());
      const info = describeRank(board, finalStreak);
      lbRank.textContent = info.label;
    } else {
      board = sortBoard(loadLeaderboard());
      lbRank.textContent = board.length
        ? "No streak this run · board has " + board.length
        : "No streak recorded";
    }
    lbStreakFinal.innerHTML = String(finalStreak) + "<span>in a row</span>";
    renderLeaderboard(lastLbEntryId);
    lbScreen.classList.remove("hidden");
    // Leave game visible underneath; overlay covers it
  }

  function resetRunState() {
    round = 1;
    called = 0;
    answered = 0;
    streak = 0;
    revealed = false;
    advancing = false;
    runEnded = false;
    canAdvance = false;
    loadGen++;
    usedFileTitles = new Set();
    current = null;
    nextReady = null;
    preloadPromise = null;
    lastLbEntryId = null;
    setAdvanceUi(false);
    updateScore();
  }

  function setAdvanceUi(on) {
    canAdvance = !!on;
    if (tapHint) {
      if (on) tapHint.classList.add("visible");
      else tapHint.classList.remove("visible");
    }
    if (mainEl) {
      if (on) mainEl.classList.add("can-advance");
      else mainEl.classList.remove("can-advance");
    }
  }

  function showNameScreen() {
    lbScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
    gameShell.classList.add("hidden-game");
    nameError.classList.remove("visible");
    const saved = (localStorage.getItem(LS_NAME) || "").trim();
    playerNameInput.value = saved;
    try { playerNameInput.focus(); } catch (e) {}
  }

  function beginPlay() {
    const name = (playerNameInput.value || "").trim();
    if (!name) {
      nameError.classList.add("visible");
      playerNameInput.focus();
      return;
    }
    nameError.classList.remove("visible");
    playerName = name;
    localStorage.setItem(LS_NAME, name);
    startScreen.classList.add("hidden");
    lbScreen.classList.add("hidden");
    gameShell.classList.remove("hidden-game");
    resetRunState();
    loadInitial();
  }

  function clearAnswerUi() {
    afterReveal.classList.remove("visible");
    factEl.textContent = "";
    attrib.innerHTML = "";
    attrib.classList.remove("visible");
    choicesEl.innerHTML = "";
    choicesEl.classList.remove("visible");
    mfrEl.textContent = "";
    nameEl.textContent = "";
    subEl.textContent = "";
    photo.alt = "Business aircraft";
    setAdvanceUi(false);
  }

  function showLoading() {
    stage.classList.add("loading");
    stage.classList.remove("error", "revealed");
    photo.classList.add("hidden");
    hintBtn.style.display = "";
    hintText.classList.remove("visible");
    hintText.textContent = "";
    clearAnswerUi();
    revealed = false;

  function showError(msg) {
    stage.classList.remove("loading", "revealed");
    stage.classList.add("error");
    photo.classList.add("hidden");
    errorMsg.textContent = msg || "Couldn't load image.";
    clearAnswerUi();
  }

  function applyRound(data) {
    current = data;
    usedFileTitles.add(data.image.title);

    showLoading();
    // Keep alt generic until after answer — manufacturer/type would leak
    photo.alt = "Business aircraft";
    photo.src = data.image.url;
    photo.classList.remove("hidden");
    stage.classList.remove("loading", "error");

    // Placard text filled now but CSS keeps it translated off-screen until .revealed
    mfrEl.textContent = data.type.manufacturer;
    nameEl.textContent = data.type.displayName;
    const parts = [data.type.sizeClass];
    if (data.registration) parts.push(data.registration);
    subEl.textContent = parts.join(" · ");

    // Fact and attribution prepared but not shown until answer
    factEl.textContent = data.type.fact;
    hintText.textContent = data.type.hint;

    const titleShort = data.image.title.replace(/^File:/i, "");
    attrib.innerHTML =
      '<a href="' + escapeAttr(data.image.descriptionUrl) + '" target="_blank" rel="noopener noreferrer">' +
      escapeHtml(titleShort) + "</a>" +
      " · " + escapeHtml(data.image.artist) +
      " · via Wikimedia Commons";
    attrib.classList.remove("visible");

    renderChoices(data.type);

    hintBtn.disabled = false;
    advancing = false;
    setAdvanceUi(false);
    updateScore();

    startPreloadNext();
    warmUpcomingTypes(3);
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/'/g, "&#39;");
  }

  function startPreloadNext() {
    nextReady = null;
    const gen = loadGen;
    preloadPromise = prepareRound(null)
      .then(function (data) {
        if (gen !== loadGen) return null;
        nextReady = data;
        return data;
      })
      .catch(function () {
        if (gen === loadGen) nextReady = null;
        return null;
      });
  }

  async function loadInitial() {
    const gen = ++loadGen;
    showLoading();
    refillDeck(null);
    warmUpcomingTypes(4);
    try {
      const data = await prepareRound(null);
      if (gen !== loadGen) return;
      applyRound(data);
    } catch (e) {
      if (gen !== loadGen) return;
      showError(e.message || "Couldn't load image.");
    }
  }

  function onChoose(selected) {
    if (revealed || !current || stage.classList.contains("loading") || stage.classList.contains("error")) {
      return;
    }
    revealed = true;
    setAdvanceUi(false);

    const correctKey = typeKey(current.type);
    const selectedKey = typeKey(selected);
    const isCorrect = selectedKey === correctKey;

    const buttons = choicesEl.querySelectorAll(".choice-btn");
    buttons.forEach(function (btn) {
      btn.disabled = true;
      const key = btn.dataset.key;
      if (key === correctKey) {
        btn.classList.add("correct");
      } else if (key === selectedKey && !isCorrect) {
        btn.classList.add("wrong");
      } else {
        btn.classList.add("dimmed");
      }
    });

    // Reveal placard on photo
    stage.classList.add("revealed");

    // Show fact + attribution; update alt now that answer is known
    photo.alt = labelFor(current.type);
    afterReveal.classList.add("visible");
    attrib.classList.add("visible");

    // Hide hint button after answer; leave hint text if already shown
    hintBtn.style.display = "none";

    answered++;
    if (isCorrect) {
      called++;
      streak++;
      updateScore();
      // Enable tap-to-continue after this click finishes (avoid bubble/double-tap)
      requestAnimationFrame(function () {
        setTimeout(function () {
          if (revealed && !runEnded && !advancing) setAdvanceUi(true);
        }, 100);
      });
    } else {
      const finalStreak = streak; // streak before the miss
      streak = 0;
      updateScore();
      setAdvanceUi(false);
      // Brief beat so player sees the wrong highlight, then leaderboard
      setTimeout(function () {
        endRun(finalStreak);
      }, 400);
    }
  }

  function showHint() {
    if (revealed) return;
    hintBtn.style.display = "none";
    hintText.classList.add("visible");
  }

  async function advance() {
    if (advancing || !revealed || runEnded || !canAdvance) return;
    advancing = true;
    setAdvanceUi(false);
    const gen = ++loadGen;

    round++;
    updateScore();

    showLoading();

    try {
      let data = nextReady;
      nextReady = null;
      if (!data && preloadPromise) {
        try { data = await preloadPromise; } catch (_) {}
      }
      if (gen !== loadGen) return;
      if (!data) {
        data = await prepareRound(null);
      }
      if (gen !== loadGen) return;
      applyRound(data);
    } catch (e) {
      if (gen !== loadGen) return;
      showError(e.message || "Couldn't load next image.");
      advancing = false;
    }
  }

  function onTapAdvance(e) {
    if (!canAdvance || !revealed || runEnded || advancing) return;
    // Leaderboard / start overlays own the screen — never dismiss via body tap
    if (!lbScreen.classList.contains("hidden")) return;
    if (!startScreen.classList.contains("hidden")) return;
    // Don't steal interactive controls (options already disabled; still protect links/retry)
    const t = e.target;
    if (t.closest && t.closest("a, button, input, .choice-btn, .lb-card, .start-card")) return;
    advance();
  }

  // Choice clicks: stop bubbling so answer click never triggers advance
  choicesEl.addEventListener("pointerup", function (e) { e.stopPropagation(); });
  choicesEl.addEventListener("click", function (e) { e.stopPropagation(); });

  hintBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    showHint();
  });

  // Tap / click anywhere on the game shell after a correct reveal advances
  gameShell.addEventListener("pointerup", onTapAdvance);
  // Keyboard: Space / Enter also advance when allowed
  document.addEventListener("keydown", function (e) {
    if (!canAdvance) return;
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      advance();
    }
  });

  retryBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    loadGen++;
    loadInitial();
  });

  startBtn.addEventListener("click", function () { beginPlay(); });
  playerNameInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      beginPlay();
    }
  });
  playAgainBtn.addEventListener("click", function () {
    showNameScreen();
  });

  // Boot — name screen first; game loads after Start
  showNameScreen();
})();
</script>
</body>
</html>
